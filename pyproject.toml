[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sum-reconstruction"
version = "0.1.1"
description = "Exact witnesses for protected cells reconstructed from overlapping aggregate releases."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
sum-reconstruction = "sum_reconstruction.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/sum-reconstruction"
Issues = "https://github.com/KanadeK/sum-reconstruction/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["sum_reconstruction"]
branch = true

[tool.coverage.report]
show_missing = true
